[project]
name = "leadradar"
version = "0.1.0"
description = "Digital packaging B2B opportunity radar for food/agri/region-brand leads"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlmodel>=0.0.22",
  "psycopg[binary]>=3.2.0",
  "pyyaml>=6.0.2",
  "httpx>=0.27.0",
  "trafilatura>=1.12.0",
  "beautifulsoup4>=4.12.0",
  "python-dateutil>=2.9.0",
  "tenacity>=8.5.0",
  "openpyxl>=3.1.5"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "playwright>=1.47.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
